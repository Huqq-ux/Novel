# ============================================================
# 墨语小说微服务 Docker Compose 配置
# 启动: docker-compose up -d
# 停止: docker-compose down
# 日志: docker-compose logs -f [service-name]
# ============================================================

services:
  # ========================================
  # 基础设施
  # ========================================

  # Nacos 3.2.1 注册中心/配置中心/A2A Registry
  # 如果 Docker Hub 拉不到，换阿里云镜像:
  #   image: registry.cn-hangzhou.aliyuncs.com/nacos/nacos-server:v3.2.1
  nacos:
    image: nacos/nacos-server:v3.2.1
    container_name: nacos-standalone
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - novel-net
    restart: unless-stopped

  # MySQL 8.0
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=novel
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - novel-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

  # Redis 7
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - novel-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes

  # ========================================
  # 微服务（按依赖顺序排列）
  # ========================================

  # 用户服务 :8081
  novel-user-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: novel-user-service
    expose:
      - "8081"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_URL=jdbc:mysql://mysql:3306/novel?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - SERVER_PORT=8081
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novel-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "--connect-timeout", "3", "--max-time", "5", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # 书籍服务 :8082
  novel-book-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: novel-book-service
    expose:
      - "8082"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_URL=jdbc:mysql://mysql:3306/novel?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8082
      - FILE_UPLOAD_PATH=/data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novel-net
    restart: unless-stopped

  # 支付服务 :8085
  novel-payment-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: novel-payment-service
    expose:
      - "8085"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_URL=jdbc:mysql://mysql:3306/novel?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8085
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novel-net
    restart: unless-stopped

  # 阅读服务 :8083
  novel-reading-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: novel-reading-service
    expose:
      - "8083"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_URL=jdbc:mysql://mysql:3306/novel?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8083
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novel-net
    restart: unless-stopped

  # 交互服务 :8084
  novel-interaction-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: novel-interaction-service
    expose:
      - "8084"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_URL=jdbc:mysql://mysql:3306/novel?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8084
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novel-net
    restart: unless-stopped

  # 管理后台服务 :8086
  novel-admin-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: novel-admin-service
    expose:
      - "8086"
    environment:
      - NACOS_ADDR=nacos:8848
      - DB_URL=jdbc:mysql://mysql:3306/novel?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8086
      - FILE_UPLOAD_PATH=/data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novel-net
    restart: unless-stopped

  # ========================================
  # 网关 :8080（最后启动，依赖基础服务）
  # ========================================

  novel-gateway:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: novel-gateway
    ports:
      - "8080:8080"
    environment:
      - NACOS_ADDR=nacos:8848
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - SERVER_PORT=8080
    depends_on:
      nacos:
        condition: service_started
    networks:
      - novel-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "--connect-timeout", "3", "--max-time", "5", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ========================================
  # AI 服务 :8001（Python A2A Agent）
  # ========================================

  novel-ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    expose:
      - "8001"
    environment:
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-novel}
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - AI_SERVICE_PORT=8001
      - NACOS_ADDR=nacos:8848
      - BGE_MODEL_PATH=/app/bge-model
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - chroma_data:/app/app/chroma_data
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novel-net
    restart: unless-stopped

  # ========================================
  # Nginx 前端
  # ========================================

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      novel-gateway:
        condition: service_healthy
    networks:
      - novel-net
    restart: unless-stopped

# ============================================================
# 持久化存储
# ============================================================

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  chroma_data:
  nacos_data:

# ============================================================
# 网络
# ============================================================

networks:
  novel-net:
    driver: bridge
