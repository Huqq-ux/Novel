spring:
  application:
    name: novel-gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # User Service
            - id: user-service-auth
              uri: lb://novel-user-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: user-service-user
              uri: lb://novel-user-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1
            - id: user-service-notifications
              uri: lb://novel-user-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1
            - id: user-service-author
              uri: lb://novel-user-service
              predicates:
                - Path=/api/author/**
              filters:
                - StripPrefix=1
            # Book Service
            - id: book-service-author-books
              uri: lb://novel-book-service
              predicates:
                - Path=/api/author/books/**
              filters:
                - StripPrefix=1
            - id: book-service
              uri: lb://novel-book-service
              predicates:
                - Path=/api/books/**
              filters:
                - StripPrefix=1
            - id: book-service-upload
              uri: lb://novel-book-service
              predicates:
                - Path=/api/upload/**
              filters:
                - StripPrefix=1
            # Reading Service
            - id: reading-service-bookshelf
              uri: lb://novel-reading-service
              predicates:
                - Path=/api/bookshelf/**
              filters:
                - StripPrefix=1
            - id: reading-service-bookmarks
              uri: lb://novel-reading-service
              predicates:
                - Path=/api/bookmarks/**
              filters:
                - StripPrefix=1
            - id: reading-service-unlock
              uri: lb://novel-reading-service
              predicates:
                - Path=/api/unlock/**
              filters:
                - StripPrefix=1
            # Interaction Service
            - id: interaction-service-comments
              uri: lb://novel-interaction-service
              predicates:
                - Path=/api/comments/**
              filters:
                - StripPrefix=1
            - id: interaction-service-ratings
              uri: lb://novel-interaction-service
              predicates:
                - Path=/api/ratings/**
              filters:
                - StripPrefix=1
            - id: interaction-service-tips
              uri: lb://novel-interaction-service
              predicates:
                - Path=/api/tips/**
              filters:
                - StripPrefix=1
            - id: interaction-service-book-lists
              uri: lb://novel-interaction-service
              predicates:
                - Path=/api/book-lists/**
              filters:
                - StripPrefix=1
            # Payment Service
            - id: payment-service-coin
              uri: lb://novel-payment-service
              predicates:
                - Path=/api/coin/**
              filters:
                - StripPrefix=1
            - id: payment-service-signin
              uri: lb://novel-payment-service
              predicates:
                - Path=/api/signin/**
              filters:
                - StripPrefix=1
            # Admin Service
            - id: admin-service
              uri: lb://novel-admin-service
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=1
            # AI Service — keep /api/ai prefix
            - id: ai-service
              uri: lb://novel-ai-agent
              predicates:
                - Path=/api/ai/**
              filters:
                - StripPrefix=0

server:
  port: 8090

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:3600000}
